[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-planning-agent"
version = "0.1.0"
description = "Budget-aware stateful content planning agent"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
content-agent = "content_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
